; Code by Grey and my buddy Claude AI
; CYD 2.8" (ESP32-2432S028) starter. Pins/drivers taken from Grey-Lancaster/CYD-and-Freenove-Fish-Tank (env cyd28).
;   pio run -e cyd28        one USB port, ILI9341 (most common)
;   pio run -e cyd28usb2    two USB ports, ST7789 (same pins). Wrong colours = wrong env.
;   pio run -e cyd40        Freenove ESP32 Display 4.0" (ESP32-32E), ST7796, resistive touch
;   pio run -e freenove4    Freenove FNK0104S 4.0" (ESP32-S3 N16R8), ST7796 480x320, FT6336U capacitive touch
;   pio run -e freenove28   Freenove FNK0104B/AB 2.8" (ESP32-S3 N16R8), ILI9341 320x240, FT6336U capacitive touch
;   pio run -e cyd40-ota -t upload   same build, sent over WiFi (board must be on WiFi; see the WiFi button)
[platformio]
default_envs = cyd40
boards_dir = boards

[env]
platform = espressif32@6.10.0
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git
    ; WiFi + OTA updates, same versions as Fish Tank (LVGL only draws the on-screen WiFi picker)
    https://github.com/Grey-Lancaster/TouchWifiProvisioner.git#1.6.8
    https://github.com/ayushsharma82/ElegantOTA.git#00674c4656def54f7f96a142c26c1f044a63043b
    lvgl/lvgl@8.4.0
build_flags =
    -O2
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT

[env:cyd28]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER

[env:cyd28usb2]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER
    -DTFT_INVERSION_OFF

; Freenove ESP32 Display 4.0" (ESP32-32E, no PSRAM): ST7796 480x320, XPT2046 touch ON THE DISPLAY BUS (TOUCH_CS 33),
; backlight on 27, speaker amp enable GPIO4 (active LOW). Pins from Fish Tank env cyd40. Overrides the 2.8" values above.
[env:cyd40]
build_flags =
    -O2
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_CYD40
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DST7796_DRIVER
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DSPI_TOUCH_FREQUENCY=2500000
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT

; Freenove FNK0104S 4.0": ESP32-S3 N16R8, ST7796 480x320, FT6336U touch on I2C (16/15). Pins from Fish Tank env freenove4.
[env:freenove4]
board = ESP32-S3-WROOM-1-N16R8
board_build.partitions = default_16MB.csv
build_flags =
    -O2
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_FREENOVE_S3
    -DBOARD_FREENOVE4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DST7796_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=80000000
    -DUSE_HSPI_PORT=1

; Freenove FNK0104B/AB 2.8": ESP32-S3 N16R8, ILI9341 320x240, FT6336U touch. Pins from Fish Tank env freenove28.
; Do NOT define USE_HSPI_PORT here (Fish Tank note).
[env:freenove28]
board = ESP32-S3-WROOM-1-N16R8
board_build.partitions = default_16MB.csv
build_flags =
    -O2
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_FREENOVE_S3
    -DBOARD_FREENOVE28
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000

; Over-the-air uploads: the same builds sent over WiFi to http://games-<env>.local (ArduinoOTA).
[env:cyd40-ota]
extends = env:cyd40
upload_protocol = espota
upload_port = games-cyd40.local

[env:cyd28-ota]
extends = env:cyd28
upload_protocol = espota
upload_port = games-cyd28.local

[env:cyd28usb2-ota]
extends = env:cyd28usb2
upload_protocol = espota
upload_port = games-cyd28usb2.local

[env:freenove4-ota]
extends = env:freenove4
upload_protocol = espota
upload_port = games-freenove4.local

[env:freenove28-ota]
extends = env:freenove28
upload_protocol = espota
upload_port = games-freenove28.local
