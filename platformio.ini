; Code by Grey and my buddy Claude AI
; CYD 2.8" (ESP32-2432S028) starter. Pins/drivers taken from Grey-Lancaster/CYD-and-Freenove-Fish-Tank (env cyd28).
;   pio run -e cyd28        one USB port, ILI9341 (most common)
;   pio run -e cyd28usb2    two USB ports, ST7789 (same pins). Wrong colours = wrong env.
[platformio]
default_envs = cyd40

[env]
platform = espressif32@6.10.0
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git
build_flags =
    -O2
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT

[env:cyd28]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER

[env:cyd28usb2]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER
    -DTFT_INVERSION_OFF

; Freenove ESP32 Display 4.0" (ESP32-32E, no PSRAM): ST7796 480x320, XPT2046 touch ON THE DISPLAY BUS (TOUCH_CS 33),
; backlight on 27, speaker amp enable GPIO4 (active LOW). Pins from Fish Tank env cyd40. Overrides the 2.8" values above.
[env:cyd40]
build_flags =
    -O2
    -DBOARD_CYD40
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DST7796_DRIVER
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DSPI_TOUCH_FREQUENCY=2500000
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT
